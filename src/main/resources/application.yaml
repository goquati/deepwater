server:
  port: 8800
spring:
  cache:
    type: caffeine
    cache-names: base64-cache
    caffeine:
      spec: maximumSize=500,expireAfterWrite=24h
  config:
    import: optional:classpath:.env[.properties]
  application:
    name: deepwater
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ocr-route
              uri: https://docling.infra.openhippo.io
              predicates:
                - Path=/ocr/**
              filters:
                - StripPrefix=1
                - Ocr
            - id: openhippo-catch-all
              uri: https://api.openhippo.io
              predicates:
                - Path=/**
              filters:
                - Llm

model:
  base-url: https://api.openhippo.io
  api-key: your-api-key-here
  vision: hippo-coding
  capabilities:
    hippo-vision:
      - vision

ocr:
  base-url: https://docling.infra.openhippo.io
  api-key: your-api-key-here
