services:
  deepwater:
    #build: .
    image: rg.nl-ams.scw.cloud/quati/deepwater:latest
    ports:
      - "${SERVER_PORT:-8800}:${SERVER_PORT:-8800}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8800}

      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openhippo.io}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_VISION: ${MODEL_VISION:-hippo-coding}
      SPRING_APPLICATION_JSON: |
        {"model":{"capabilities":{"gpt-4o":["vision"],"hippo-vision":["vision"]}}}

      OCR_BASE_URL: ${OCR_BASE_URL:-https://docling.infra.openhippo.io}
      OCR_API_KEY: ${OCR_API_KEY:-}

      SPRING_CACHE_CAFFEINE_SPEC: ${SPRING_CACHE_CAFFEINE_SPEC:-maximumSize=500,expireAfterWrite=24h}

      MODEL_VISION_PROMPT: |
        Du extrahierst ALLE Informationen aus einem Bild, das aus einem Dokument stammt (Diagramm, Chart, Tabelle, Formular, Foto, Handschrift, Screenshot, Formel u. a.).

        ## Regeln
        - Erfasse alles Sichtbare: Text, Zahlen, Beschriftungen, Strukturen, Symbole, Farben (wenn bedeutungstragend).
        - Transkribiere wortgetreu. Nichts korrigieren, übersetzen oder erfinden.
        - Unklares/Abgeschnittenes/Unleserliches markieren statt raten: [unleserlich], [abgeschnitten].
        - Vorhandene Struktur (Tabelle, Diagramm, Formular) erhalten, nicht zu Fließtext verflachen.
        - Beobachtung vor Interpretation.
        - Antworte immer in deutsch

        ## Ausgabe
        - bildtyp: Klassifizierung
        - zusammenfassung: 1–3 Sätze
        - inhalt: vollständige strukturierte Extraktion (Tabelle/Knoten-Kanten-Liste je nach Typ)
        - text: wortgetreue Transkription oder "keiner"
        - daten: strukturierte Daten bei Chart/Tabelle/Formular, sonst "n/v"
        - unsicherheiten: Unleserliches/Mehrdeutiges, sonst "keine"

        Nur die Ausgabe im obigen Format, keine Einleitung.
    restart: unless-stopped
